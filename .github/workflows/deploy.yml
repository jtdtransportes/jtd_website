name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main
  # Permite publicar manualmente pela aba Actions ("Run workflow").
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys simultâneos; o mais recente substitui o anterior.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: frontend/jtd
        run: npm install

      - name: Build React app
        working-directory: frontend/jtd
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/jtd/build

  # Job separado: se a publicação falhar, "Re-run failed jobs" repete só esta
  # etapa e reaproveita o mesmo artefato (sem gerar artefatos duplicados).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
