name: ANTT - sincronizar precos ANP

# Dispara a sincronizacao da ANP no backend publicado (Render) a cada 6 horas, a partir dos servidores
# do GitHub (nao depende de nenhum computador ligado). Se a instancia do Render estiver hibernando,
# a primeira tentativa a acorda e as seguintes concluem a sincronizacao.
#
# Configuracao (uma vez):
#   GitHub > Settings > Secrets and variables > Actions:
#     ANTT_API_URL       = https://jtd-website.onrender.com   (sem barra no final)
#     ANTT_CRON_SECRET   = mesmo valor da variavel ANTT_CRON_SECRET do servico no Render (>= 24 caracteres)
# Sem esses segredos o job apenas registra que esta desativado e termina com sucesso.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Disparar sincronizacao ANP
        env:
          API_URL: ${{ secrets.ANTT_API_URL }}
          CRON_SECRET: ${{ secrets.ANTT_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Segredos ANTT_API_URL/ANTT_CRON_SECRET nao configurados - sincronizacao externa desativada."
            exit 0
          fi
          for tentativa in 1 2 3 4 5; do
            codigo=$(curl -sS -o resposta.json -w "%{http_code}" --max-time 300 \
              -X POST "$API_URL/api/antt/cron/sync" -H "X-ANTT-Cron-Secret: $CRON_SECRET" || echo "000")
            echo "Tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "200" ]; then cat resposta.json; echo; exit 0; fi
            if [ "$codigo" = "401" ] || [ "$codigo" = "404" ]; then cat resposta.json; echo; exit 1; fi
            sleep 45
          done
          echo "Backend nao respondeu apos 5 tentativas."
          exit 1
